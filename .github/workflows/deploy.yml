name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint PHP API files
        run: |
          status=0
          for f in $(find public/api -name "*.php"); do
            php -l "$f" || status=1
          done
          exit $status

      - name: Build frontend
        run: npm run build

      - name: Deploy dist/ to public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./public_html/
          # Never let a deploy touch live CMS data or guest-uploaded media, even
          # if it ever ends up nested under public_html on a restricted plan.
          # cms-data/ and cms-backups/ are managed manually, outside this
          # pipeline entirely — see HOSTINGER-DEPLOYMENT.md.
          exclude: |
            **/.git*
            **/.git*/**
            uploads/**
            cms-data/**
            cms-backups/**
